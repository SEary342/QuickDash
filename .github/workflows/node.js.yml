name: Node.js CI

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    strategy:
      matrix:
        node-version: [24.x]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Security audit
        run: npm audit --audit-level=high
        continue-on-error: true

      - name: Check for unused code and dependencies (Knip)
        run: npx knip
        continue-on-error: true

      - name: Lint
        run: npm run lint

      - name: Run tests with coverage
        run: npm run test:coverage

      - name: Build production page
        run: npm run build

      - name: Upload release page
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: quickdash-release-page
          path: docs/index.html
          if-no-files-found: error
          retention-days: 1

      - name: Add coverage summary
        if: always()
        run: |
          node scripts/coverage-summary.cjs

  release:
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Find unreleased version tag
        id: tag
        shell: bash
        run: |
          version="$(node -p "JSON.parse(require('node:fs').readFileSync('package.json', 'utf8')).version")"
          tag="v${version}"

          if ! git show-ref --tags --verify --quiet "refs/tags/${tag}"; then
            echo "::notice::No version tag ${tag} exists; skipping release."
            exit 0
          fi

          if gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${tag}" >/dev/null 2>&1; then
            echo "::notice::A GitHub release for ${tag} already exists; skipping."
            exit 0
          fi

          echo "name=${tag}" >> "$GITHUB_OUTPUT"

      - name: Download release page
        if: steps.tag.outputs.name != ''
        uses: actions/download-artifact@v4
        with:
          name: quickdash-release-page
          path: release

      - name: Create GitHub release
        if: steps.tag.outputs.name != ''
        run: |
          gh release create \
            "${{ steps.tag.outputs.name }}" \
            "release/index.html#QuickDash.html" \
            --title "${{ steps.tag.outputs.name }}" \
            --generate-notes